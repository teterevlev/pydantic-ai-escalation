# Load with:
#   Agent.from_file('examples/agent.yaml', custom_capability_types=[EscalateOnOutputRetry])
retries:
  output: 4  # EscalateOnOutputRetry.required_output_retries for these levels: 2 + 2 + 1 - 1
capabilities:
  - EscalateOnOutputRetry:
      levels:
        - {model: openai:gpt-4o-mini, output_retries: 1}
        - {model: openai:gpt-5.6-terra, output_retries: 1}
        - {model: openai:gpt-5.6-sol}
