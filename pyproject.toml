[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-escalation"
version = "0.1.0"
description = "Escalate a Pydantic AI agent to a stronger model when output validation keeps failing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleg Teterevlev", email = "o.damage@gmail.com" }]
requires-python = ">=3.10"
keywords = ["pydantic-ai", "llm", "agents", "model routing", "cascade", "escalation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic-ai-slim>=2.51.0"]

[project.urls]
Homepage = "https://github.com/teterevlev/pydantic-ai-escalation"
Repository = "https://github.com/teterevlev/pydantic-ai-escalation"
Issues = "https://github.com/teterevlev/pydantic-ai-escalation/issues"
Author = "https://revlev.org/"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "pytest-cov>=5",
    "pyright>=1.1.400",
    "ruff>=0.6",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_escalation"]

[tool.hatch.build.targets.sdist]
include = ["pydantic_ai_escalation", "tests", "examples", "README.md", "DESIGN.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["pydantic_ai_escalation", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pydantic_ai_escalation"]

[tool.coverage.report]
fail_under = 100
show_missing = true
